
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Zip kholo
        run: for z in *.zip; do unzip -q -o "$z"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: APK banao
        working-directory: RoomChecker
        run: gradle assembleDebug --no-daemon

      - name: GitHub Release banao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RoomChecker v1.0.${{ github.run_number }}
          files: RoomChecker/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
